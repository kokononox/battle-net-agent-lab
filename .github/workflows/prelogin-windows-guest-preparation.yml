name: Official Windows media and paused guest preparation - no Windows boot
on:
  push:
    branches: [research/prelogin-telemetry-wow-data-provenance]
    paths:
      - 'analysis-tools/prelogin-windows-guest/**'
      - '.github/workflows/prelogin-windows-guest-preparation.yml'
permissions: {}
concurrency:
  group: windows-guest-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved official windows preparation d3'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BNET_WINDOWS_PREP: owned-windows-prep-d3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Unit contracts - no cleanup or downloads
        run: /usr/bin/python3 -m unittest discover -s analysis-tools/prelogin-windows-guest -p 'test_*.py' -v
      - name: Prepare fixed tools, Microsoft media and paused KVM guest only
        run: >-
          sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_RUN_ATTEMPT,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_WORKSPACE,RUNNER_TEMP,BNET_WINDOWS_PREP
          /usr/bin/python3 analysis-tools/prelogin-windows-guest/prepare_guest.py
      - name: Strict public summary only
        if: always()
        run: /usr/bin/python3 analysis-tools/prelogin-windows-guest/prepare_guest.py validate output/windows-guest-preparation.json sanitized/windows-guest-preparation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-guest-preparation-summary
          path: sanitized/windows-guest-preparation.json
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/prelogin-telemetry-wow-data-provenance
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-guest-preparation-summary
          path: incoming
      - name: Validate and publish only preparation facts
        run: |
          set -euo pipefail
          python3 analysis-tools/prelogin-windows-guest/prepare_guest.py validate incoming/windows-guest-preparation.json reports/windows-guest-preparation-runtime.json
          git config user.name prelogin-wire-report
          git config user.email prelogin-wire-report@users.noreply.github.com
          git add -- reports/windows-guest-preparation-runtime.json
          git diff --cached --quiet && exit 0
          git commit -m 'lab: publish sanitized Windows media preparation facts'
          git push origin HEAD:research/prelogin-telemetry-wow-data-provenance
