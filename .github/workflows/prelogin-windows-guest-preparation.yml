name: Official Windows media preparation with bounded CI reporting
on:
  push:
    branches: [research/prelogin-telemetry-wow-data-provenance]
    paths:
      - 'analysis-tools/prelogin-windows-guest/**'
      - '.github/workflows/prelogin-windows-guest-preparation.yml'
permissions: {}
concurrency:
  group: windows-guest-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved official windows preparation d5'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/prelogin-telemetry-wow-data-provenance
      - name: Publish typed start receipt only
        env:
          SOURCE: ${{ github.sha }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 analysis-tools/prelogin-windows-guest/ci_status.py reports/windows-guest-preparation-ci.json "$SOURCE" "$RUN" dispatched
          git config user.name prelogin-wire-report
          git config user.email prelogin-wire-report@users.noreply.github.com
          git add -- reports/windows-guest-preparation-ci.json
          git commit -m 'lab: publish preparation dispatch receipt'
          git push origin HEAD:research/prelogin-telemetry-wow-data-provenance
  prepare:
    needs: dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    permissions:
      contents: read
    env:
      BNET_WINDOWS_PREP: owned-windows-prep-d5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Unit contracts
        id: contracts
        run: /usr/bin/python3 -m unittest discover -s analysis-tools/prelogin-windows-guest -p 'test_*.py' -v
      - name: Prepare official media and paused KVM only
        id: prepare
        timeout-minutes: 22
        run: >-
          sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_RUN_ATTEMPT,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_WORKSPACE,RUNNER_TEMP,BNET_WINDOWS_PREP
          /usr/bin/python3 analysis-tools/prelogin-windows-guest/diagnostic_entry.py
      - name: Strict summary
        id: sanitize
        if: always()
        run: |
          python3 analysis-tools/prelogin-windows-guest/diagnostic_entry.py validate output/windows-guest-preparation-diagnostic.json sanitized/windows-guest-preparation-diagnostic.json
          python3 analysis-tools/prelogin-windows-guest/prepare_guest.py validate output/windows-guest-preparation.json sanitized/windows-guest-preparation.json
      - name: Record public step outcomes even when preparation fails
        if: always()
        env:
          SOURCE: ${{ github.sha }}
          RUN: ${{ github.run_id }}
          CONTRACTS: ${{ steps.contracts.outcome }}
          PREPARE: ${{ steps.prepare.outcome }}
          SANITIZE: ${{ steps.sanitize.outcome }}
        run: python3 analysis-tools/prelogin-windows-guest/ci_status.py sanitized/windows-guest-preparation-ci.json "$SOURCE" "$RUN" completed "$CONTRACTS" "$PREPARE" "$SANITIZE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-guest-preparation-summary
          path: sanitized/*.json
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: [dispatch, prepare]
    if: always() && needs.dispatch.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/prelogin-telemetry-wow-data-provenance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-guest-preparation-summary
          path: incoming
      - name: Validate and publish only matching public outcomes
        env:
          SOURCE: ${{ github.sha }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'analysis-tools/prelogin-windows-guest')
          from ci_status import status
          from prepare_guest import validate
          from diagnostic_entry import validate as validate_diag
          r=json.loads(Path('incoming/windows-guest-preparation-ci.json').read_text())
          expected=status(os.environ['SOURCE'],os.environ['RUN'],'completed',r['tests'],r['preparation'],r['sanitization'])
          if r!=expected:raise SystemExit('invalid_typed_outcome')
          Path('reports/windows-guest-preparation-ci.json').write_text(json.dumps(r,indent=2)+'\n')
          diag=validate_diag(json.loads(Path('incoming/windows-guest-preparation-diagnostic.json').read_text()))
          if diag['source_commit']!=os.environ['SOURCE'] or diag['run_id']!=os.environ['RUN']:raise SystemExit('diagnostic_source_mismatch')
          Path('reports/windows-guest-preparation-diagnostic.json').write_text(json.dumps(diag,indent=2)+'\n')
          p=Path('incoming/windows-guest-preparation.json')
          if p.exists():
           facts=validate(json.loads(p.read_text()))
           if facts['source_commit']!=os.environ['SOURCE'] or facts['run_id']!=os.environ['RUN']:raise SystemExit('source_mismatch')
           Path('reports/windows-guest-preparation-runtime.json').write_text(json.dumps(facts,indent=2)+'\n')
          PY
          git config user.name prelogin-wire-report
          git config user.email prelogin-wire-report@users.noreply.github.com
          git add -- reports/windows-guest-preparation-ci.json reports/windows-guest-preparation-runtime.json reports/windows-guest-preparation-diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m 'lab: publish sanitized preparation outcome including failures'
          git push origin HEAD:research/prelogin-telemetry-wow-data-provenance
