name: Two-host G72 case-aware public schema and configuration path attribution
on:
  push:
    branches: [research/battlenet-minimal-install-isolation-2026-10-25]
    paths: ['analysis-tools/two-host-live-g72/**', '.github/workflows/battlenet-live-content-g72.yml']
permissions: {}
concurrency:
  group: two-host-live-g72
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.event.head_commit.message == 'lab: approved case-aware public schema attribution G72' && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      BNET_G72: approved-live-startup-two-hosts-g72
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify pinned base and materialize research overlay
        run: python analysis-tools/two-host-live-g72/compose.py
      - name: Parse and test before any execution or firewall mutation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $t=$null;$e=$null
          foreach($file in Get-ChildItem analysis-tools/two-host-live-g72-runtime/*.ps1){
            $null=[Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$t,[ref]$e)
            if($e.Count){throw 'powershell_parse_failed'}
          }
          python -m compileall -q analysis-tools/two-host-live-g72-runtime
          if($LASTEXITCODE -ne 0){throw 'python_parse_failed'}
          python -m unittest discover -s analysis-tools/two-host-live-g72-runtime -p 'test_*.py' -v
          if($LASTEXITCODE -ne 0){throw 'parser_tests_failed'}
      - name: Install pinned observation dependency
        run: python -m pip install --disable-pip-version-check frida==17.24.2
      - name: Native x86 and x64 transport and prior-key provenance controls
        shell: powershell
        run: |
          python analysis-tools/two-host-live-g72-runtime/control.py
          if($LASTEXITCODE -ne 0){throw 'positive_control_failed_no_installer_launch'}
      - name: Guarded language Continue then bounded content observation
        shell: powershell
        run: |
          python analysis-tools/two-host-live-g72-runtime/run.py
          if($LASTEXITCODE -ne 0){throw 'live_probe_failed_review_sanitized_report'}
      - name: Fallback cleanup on disposable runner only
        if: always()
        shell: powershell
        run: |
          if(Test-Path (Join-Path $env:RUNNER_TEMP 'g72-tls-cert.PRIVATE.json')){& ./analysis-tools/two-host-live-g72-runtime/TlsCert.ps1 -Action Cleanup}
          $r=Join-Path $env:RUNNER_TEMP 'g72-private'
          if(Test-Path (Join-Path $r 'armed')){& ./analysis-tools/two-host-live-g72-runtime/Gate.ps1 -Action Restore -Root $r}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: two-host-live-g72-sanitized
          path: |
            output/g72-native-control.json
            output/two-host-live-g72.json
          if-no-files-found: warn
          retention-days: 3
