name: Bounded resume error diagnostics test
on:
  push:
    branches: [privacy-observation-20261018-a1]
    paths: ['sstp-resume-diagnostics/**', '.github/workflows/sstp-resume-diagnostics.yml']
permissions: {}
jobs:
  windows:
    if: "${{ github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'test: approved bounded resume diagnostics') }}"
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse and test exception message redaction without firewall operations
        id: test
        continue-on-error: true
        shell: powershell
        run: |
          foreach($f in Get-ChildItem 'sstp-resume-diagnostics' -Filter '*.ps1'){
            $t=$null;$e=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($f.FullName,[ref]$t,[ref]$e)
            if($e.Count){throw 'diagnostic_parse_error'}
          }
          & "$PSHOME/powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File './sstp-resume-diagnostics/Test-Diagnostic.ps1' -OutputPath (Join-Path $env:RUNNER_TEMP 'diagnostic-test.json')
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          exit 0
      - name: Validate bounded receipt
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: python sstp-resume-diagnostics/receipt.py
      - name: Upload bounded receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: resume-diagnostic-receipt
          path: sstp-resume-diagnostics/build-receipt.json
          retention-days: 3
          if-no-files-found: error
