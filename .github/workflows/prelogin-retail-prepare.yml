name: Logged-out Retail container marker witness T12
on:
  push:
    branches: [research/prelogin-telemetry-wow-data-provenance]
    paths:
      - 'analysis-tools/prelogin-retail-prepare/**'
      - '.github/workflows/prelogin-retail-prepare.yml'
permissions: {}
concurrency:
  group: prelogin-retail-prepare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dispatch:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved same-budget container marker witness t12'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/prelogin-telemetry-wow-data-provenance
      - name: Publish typed start receipt
        env:
          SOURCE: ${{ github.sha }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 analysis-tools/prelogin-retail-prepare/ci_status.py reports/prelogin-retail-prepare-ci.json "$SOURCE" "$RUN" dispatched
          git config user.name prelogin-wire-report
          git config user.email prelogin-wire-report@users.noreply.github.com
          git add -- reports/prelogin-retail-prepare-ci.json
          git commit -m 'lab: publish Retail preparation start receipt'
          git push origin HEAD:research/prelogin-telemetry-wow-data-provenance
  observe:
    needs: dispatch
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved same-budget container marker witness t12'
    runs-on: windows-2025
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: No observation packages installed
        id: preflight
        run: python -c "import sys; assert not any(x == 'frida' or x.startswith('frida.') for x in sys.modules)"
      - name: Existing safety suite and typed control tests
        id: contracts
        run: |
          python scripts/run_safety_tests.py --output output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python analysis-tools/prelogin-retail-prepare/contract_runner.py attribution
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python analysis-tools/prelogin-retail-prepare/contract_runner.py retail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Owned Agent with explicitly approved 2GiB and 512MiB guard
        id: observation
        timeout-minutes: 6
        env:
          RETAIL_PREPARE: approved-retail-prepare-c10
          RETAIL_PREPARE_SCOPE: limited-transfer-c10
          RETAIL_START_OPERATION: owned-install-t5
          RETAIL_TCP_METER: owned-baseline-t2
          RETAIL_BUDGET_PROFILE: approved-2g-512m-t9
          RETAIL_CONTENT_PROBE: official-install-t9
          RETAIL_CONTENT_WATCH: concurrent-fixed-t10
          RETAIL_POSTSTOP_CONTENT: owned-offline-t11
          RETAIL_BOOTSTRAP_WAIT: original-120-t9
        run: python analysis-tools/prelogin-retail-prepare/guard_driver.py
      - name: Validate only counts and fixed labels
        id: sanitize
        if: always()
        run: python analysis-tools/prelogin-retail-prepare/report.py output/prelogin-retail-prepare.json sanitized/prelogin-retail-prepare.json
      - name: Validate independent supervisor receipt
        if: always()
        run: python analysis-tools/prelogin-retail-prepare/guard_report.py output/retail-supervision.json sanitized/retail-supervision.json
      - name: Validate standalone transfer receipt
        if: always()
        run: python analysis-tools/prelogin-retail-prepare/transfer_sanitize.py output/retail-transfer.json sanitized/retail-transfer.json
      - name: Validate calibrated socket receipts when present
        if: always()
        run: |
          if (Test-Path output/tcp-build.json) { python analysis-tools/prelogin-tcp-attribution/build_receipt.py output/tcp-build.json sanitized/tcp-build.json "${{ github.sha }}" "${{ github.run_id }}"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          if (Test-Path output/tcp-fixture.json) { python analysis-tools/prelogin-tcp-attribution/receipt.py output/tcp-fixture.json sanitized/tcp-fixture.json "${{ github.sha }}" "${{ github.run_id }}"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          if (Test-Path output/tcp-meter.json) { python analysis-tools/prelogin-tcp-attribution/meter_receipt.py output/tcp-meter.json sanitized/tcp-meter.json "${{ github.sha }}" "${{ github.run_id }}"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Validate post-finalization form state when present
        if: always()
        run: |
          if (Test-Path output/retail-final-form.json) { python analysis-tools/prelogin-retail-prepare/final_form.py output/retail-final-form.json sanitized/retail-final-form.json "${{ github.sha }}" "${{ github.run_id }}"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Validate fixed-field operation state when present
        if: always()
        run: |
          if (Test-Path output/retail-operation-state.json) { python analysis-tools/prelogin-retail-prepare/operation_state.py output/retail-operation-state.json sanitized/retail-operation-state.json "${{ github.sha }}" "${{ github.run_id }}"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Validate bounded pre-arm readiness when present
        if: always()
        run: |
          if (Test-Path output/prearm-quiet.json) { python analysis-tools/prelogin-tcp-attribution/prearm_quiet.py output/prearm-quiet.json sanitized/prearm-quiet.json "${{ github.sha }}" "${{ github.run_id }}"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Validate zero-product-request control when present
        if: always()
        run: |
          if (Test-Path output/preproduct-control.json) { python analysis-tools/prelogin-retail-prepare/preproduct_control.py output/preproduct-control.json sanitized/preproduct-control.json "${{ github.sha }}" "${{ github.run_id }}"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Validate official content-only receipt when present
        if: always()
        run: |
          if (Test-Path output/retail-content.json) { python analysis-tools/prelogin-retail-prepare/content_probe.py output/retail-content.json sanitized/retail-content.json "${{ github.sha }}" "${{ github.run_id }}"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Validate bounded metadata-enumeration status when present
        if: always()
        run: |
          if (Test-Path output/retail-snapshot-status.json) { python analysis-tools/prelogin-retail-prepare/snapshot_status.py output/retail-snapshot-status.json sanitized/retail-snapshot-status.json "${{ github.sha }}" "${{ github.run_id }}"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Validate fixed-label failure code when present
        if: always()
        run: |
          if (Test-Path output/retail-failure.json) { python analysis-tools/prelogin-retail-prepare/failure_receipt.py output/retail-failure.json sanitized/retail-failure.json "${{ github.sha }}" "${{ github.run_id }}"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Validate read-only post-drain witness when present
        if: always()
        run: |
          if (Test-Path output/retail-poststop.json) { python analysis-tools/prelogin-retail-prepare/poststop_content.py output/retail-poststop.json sanitized/retail-poststop.json "${{ github.sha }}" "${{ github.run_id }}"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Record typed outcomes
        if: always()
        env:
          SOURCE: ${{ github.sha }}
          RUN: ${{ github.run_id }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          CONTRACTS: ${{ steps.contracts.outcome }}
          OBSERVATION: ${{ steps.observation.outcome }}
          SANITIZATION: ${{ steps.sanitize.outcome }}
        run: python analysis-tools/prelogin-retail-prepare/ci_status.py sanitized/prelogin-retail-prepare-ci.json "$env:SOURCE" "$env:RUN" completed "$env:PREFLIGHT" "$env:CONTRACTS" "$env:OBSERVATION" "$env:SANITIZATION"
      - name: Upload only the two typed summary files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: prelogin-retail-prepare-summary
          path: sanitized/
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: [dispatch, observe]
    if: always() && needs.dispatch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/prelogin-telemetry-wow-data-provenance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: prelogin-retail-prepare-summary
          path: incoming
      - name: Revalidate source-bound reports and publish fixed paths only
        env:
          SOURCE: ${{ github.sha }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'analysis-tools/prelogin-retail-prepare')
          from ci_status import status
          from report import load
          from guard_report import validate as validate_guard, read as read_guard
          from transfer_probe import validate as validate_transfer
          from attempt_report import summarize as summarize_attempt
          r=json.loads(Path('incoming/prelogin-retail-prepare-ci.json').read_text())
          expected=status(os.environ['SOURCE'],os.environ['RUN'],'completed',r['dependencies'],r['tests'],r['observation'],r['sanitization'])
          if r!=expected:raise SystemExit('ci_identity_mismatch')
          Path('reports/prelogin-retail-prepare-ci.json').write_text(json.dumps(r,indent=2)+'\n')
          guard=transfer=d=None
          guard_path=Path('incoming/retail-supervision.json')
          if guard_path.exists():
              guard=validate_guard(read_guard(guard_path))
              if guard['source_commit']!=os.environ['SOURCE'] or guard['run_id']!=os.environ['RUN']:raise SystemExit('guard_identity_mismatch')
              Path('reports/prelogin-retail-supervision-latest.json').write_text(json.dumps(guard,indent=2)+'\n')
          transfer_path=Path('incoming/retail-transfer.json')
          if transfer_path.exists():
              transfer=validate_transfer(read_guard(transfer_path))
              if transfer['source_commit']!=os.environ['SOURCE'] or transfer['run_id']!=os.environ['RUN']:raise SystemExit('transfer_identity_mismatch')
              Path('reports/prelogin-retail-transfer-latest.json').write_text(json.dumps(transfer,indent=2)+'\n')
          p=Path('incoming/prelogin-retail-prepare.json')
          if p.exists():
              d=load(p.read_bytes())
              if d['source_commit']!=os.environ['SOURCE'] or d['run_id']!=os.environ['RUN']:raise SystemExit('control_identity_mismatch')
              Path('reports/prelogin-retail-prepare-runtime.json').write_text(json.dumps(d,indent=2)+'\n')
              compact=dict(schema='bnet-retail-path-review-1',source_commit=d['source_commit'],run_id=d['run_id'],status=d['status'],form_update=d['form_update'],initial_error_codes=d['form']['error_codes'],identity_failure_state=d['identity_failure_state'],identity_checks=d['identity_checks'],local_requests=d['local_requests'],limits=d['limits'])
              Path('reports/prelogin-retail-path-latest.json').write_text(json.dumps(compact,indent=2)+'\n')
          sys.path.insert(0,'analysis-tools/prelogin-tcp-attribution')
          import receipt as tcp_fixture, meter_receipt, build_receipt
          for name,validator,destination in [('tcp-fixture.json',tcp_fixture,'prelogin-tcp-target-calibration-latest.json'),('tcp-meter.json',meter_receipt,'prelogin-owned-tcp-meter-latest.json')]:
              if Path('incoming',name).exists():
                  m=validator.read(Path('incoming',name))
                  if m['source_commit']!=os.environ['SOURCE'] or m['run_id']!=os.environ['RUN']:raise SystemExit('tcp_identity_mismatch')
                  Path('reports',destination).write_text(json.dumps(m,indent=2)+'\n')
          if Path('incoming/tcp-build.json').exists():
              b=build_receipt.validate(json.loads(Path('incoming/tcp-build.json').read_text()))
              if b['source_commit']!=os.environ['SOURCE'] or b['run_id']!=os.environ['RUN']:raise SystemExit('tcp_build_identity_mismatch')
              Path('reports/prelogin-tcp-target-build-latest.json').write_text(json.dumps(b,indent=2)+'\n')
          if Path('incoming/retail-final-form.json').exists():
              import final_form
              f=final_form.validate(read_guard('incoming/retail-final-form.json'))
              if f['source_commit']!=os.environ['SOURCE'] or f['run_id']!=os.environ['RUN']:raise SystemExit('final_form_identity_mismatch')
              Path('reports/prelogin-retail-final-form-latest.json').write_text(json.dumps(f,indent=2)+'\n')
          if Path('incoming/retail-operation-state.json').exists():
              import operation_state
              op=operation_state.validate(read_guard('incoming/retail-operation-state.json'))
              if op['source_commit']!=os.environ['SOURCE'] or op['run_id']!=os.environ['RUN']:raise SystemExit('operation_identity_mismatch')
              Path('reports/prelogin-retail-operation-state-latest.json').write_text(json.dumps(op,indent=2)+'\n')
          if Path('incoming/prearm-quiet.json').exists():
              import prearm_quiet
              q=prearm_quiet.validate(json.loads(Path('incoming/prearm-quiet.json').read_text()))
              if q['source_commit']!=os.environ['SOURCE'] or q['run_id']!=os.environ['RUN']:raise SystemExit('quiet_identity_mismatch')
              Path('reports/prelogin-retail-prearm-quiet-latest.json').write_text(json.dumps(q,indent=2)+'\n')
          if Path('incoming/preproduct-control.json').exists():
              import preproduct_control
              pc=preproduct_control.validate(json.loads(Path('incoming/preproduct-control.json').read_text()))
              if pc['source_commit']!=os.environ['SOURCE'] or pc['run_id']!=os.environ['RUN']:raise SystemExit('preproduct_identity_mismatch')
              Path('reports/prelogin-preproduct-control-latest.json').write_text(json.dumps(pc,indent=2)+'\n')
          if Path('incoming/retail-content.json').exists():
              import content_probe
              content=content_probe.validate(read_guard('incoming/retail-content.json'))
              if content['source_commit']!=os.environ['SOURCE'] or content['run_id']!=os.environ['RUN']:raise SystemExit('content_identity_mismatch')
              Path('reports/prelogin-retail-content-latest.json').write_text(json.dumps(content,indent=2)+'\n')
          if Path('incoming/retail-snapshot-status.json').exists():
              import snapshot_status
              snap=snapshot_status.validate(read_guard('incoming/retail-snapshot-status.json'))
              if snap['source_commit']!=os.environ['SOURCE'] or snap['run_id']!=os.environ['RUN']:raise SystemExit('snapshot_identity_mismatch')
              Path('reports/prelogin-retail-snapshot-status-latest.json').write_text(json.dumps(snap,indent=2)+'\n')
          if Path('incoming/retail-failure.json').exists():
              import failure_receipt
              fail=failure_receipt.validate(read_guard('incoming/retail-failure.json'))
              if fail['source_commit']!=os.environ['SOURCE'] or fail['run_id']!=os.environ['RUN']:raise SystemExit('failure_identity_mismatch')
              Path('reports/prelogin-retail-failure-latest.json').write_text(json.dumps(fail,indent=2)+'\n')
          if Path('incoming/retail-poststop.json').exists():
              import poststop_content
              post=poststop_content.validate(read_guard('incoming/retail-poststop.json'))
              if post['source_commit']!=os.environ['SOURCE'] or post['run_id']!=os.environ['RUN']:raise SystemExit('post_identity_mismatch')
              if guard is None or guard['observation'] is None or not guard['observation']['job_drained'] or guard['observation']['final_active_processes']!=0:raise SystemExit('post_not_drained')
              Path('reports/prelogin-retail-poststop-latest.json').write_text(json.dumps(post,indent=2)+'\n')
          attempt=summarize_attempt(os.environ['SOURCE'],os.environ['RUN'],r,guard,transfer,d)
          Path('reports/prelogin-retail-attempt-latest.json').write_text(json.dumps(attempt,indent=2)+'\n')
          PY
          git config user.name prelogin-wire-report
          git config user.email prelogin-wire-report@users.noreply.github.com
          git add -- reports/prelogin-retail-prepare-ci.json reports/prelogin-retail-attempt-latest.json
          if test -f incoming/prelogin-retail-prepare.json; then git add -- reports/prelogin-retail-prepare-runtime.json reports/prelogin-retail-path-latest.json; fi
          if test -f incoming/retail-supervision.json; then git add -- reports/prelogin-retail-supervision-latest.json; fi
          if test -f incoming/retail-transfer.json; then git add -- reports/prelogin-retail-transfer-latest.json; fi
          if test -f incoming/tcp-build.json; then git add -- reports/prelogin-tcp-target-build-latest.json; fi
          if test -f incoming/tcp-fixture.json; then git add -- reports/prelogin-tcp-target-calibration-latest.json; fi
          if test -f incoming/tcp-meter.json; then git add -- reports/prelogin-owned-tcp-meter-latest.json; fi
          if test -f incoming/retail-final-form.json; then git add -- reports/prelogin-retail-final-form-latest.json; fi
          if test -f incoming/retail-operation-state.json; then git add -- reports/prelogin-retail-operation-state-latest.json; fi
          if test -f incoming/prearm-quiet.json; then git add -- reports/prelogin-retail-prearm-quiet-latest.json; fi
          if test -f incoming/preproduct-control.json; then git add -- reports/prelogin-preproduct-control-latest.json; fi
          if test -f incoming/retail-content.json; then git add -- reports/prelogin-retail-content-latest.json; fi
          if test -f incoming/retail-snapshot-status.json; then git add -- reports/prelogin-retail-snapshot-status-latest.json; fi
          if test -f incoming/retail-failure.json; then git add -- reports/prelogin-retail-failure-latest.json; fi
          if test -f incoming/retail-poststop.json; then git add -- reports/prelogin-retail-poststop-latest.json; fi
          git diff --cached --quiet && exit 0
          git commit -m 'lab: publish sanitized Retail preparation evidence'
          git push origin HEAD:research/prelogin-telemetry-wow-data-provenance
