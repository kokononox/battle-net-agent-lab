name: One-shot SSTP transaction file-model crash recovery tests
on:
  push:
    branches: [privacy-observation-20261018-a1]
    paths: ['sstp-allowlist-transaction/**', '.github/workflows/sstp-allowlist-transaction.yml']
permissions: {}
jobs:
  transaction_tests:
    if: "${{ github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'lab: approved SSTP file-model transaction p4') }}"
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse and test durable file-model transaction recovery
        id: native
        continue-on-error: true
        shell: powershell
        run: |
          foreach ($file in Get-ChildItem 'sstp-allowlist-transaction' -Filter '*.ps1') {
            $tokens=$null;$errors=$null
            $ast=[Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw 'transaction_parse_error' }
            $text=[IO.File]::ReadAllText($file.FullName)
            if ($text -match '(?i)(Set|New|Remove|Disable|Enable)-NetFirewall|Set-VpnConnection|Remove-VpnConnection|Get-VpnConnection|Resolve-DnsName|GetHostAddresses|Invoke-WebRequest|Invoke-Expression|Register-ScheduledTask|Start-Process|advfirewall|rasdial|HttpClient') { throw 'transaction_forbidden_operation' }
          }
          & './sstp-allowlist-transaction/Test-Transactions.ps1' -OutputPath (Join-Path $env:RUNNER_TEMP 'transaction-native.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate and write bounded receipt only
        if: always()
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: python sstp-allowlist-transaction/receipt.py
      - name: Upload receipt only, never journals or model snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sstp-allowlist-transaction-receipt
          path: sstp-allowlist-transaction/build-receipt.json
          retention-days: 3
          if-no-files-found: error
