name: One-shot process-birth HTTP API capture behind owned root-child gate
on:
  push:
    branches: [privacy-observation-20261018-a1]
    paths:
      - 'privacy-api/**'
      - '.github/workflows/startup-api-birth.yml'
permissions: {}
jobs:
  observe:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved gated process-birth HTTP API observation g1'
    runs-on: windows-2025
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test safety, HTTP parser and process-birth capture gate code
        run: |
          python scripts/run_safety_tests.py --output output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s privacy-network -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s privacy-http -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s privacy-api -p 'test_*.py'
      - name: Install exact hashed instrumentation only on disposable VM
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r privacy-tls/requirements.txt
      - name: Owned root-child gate, then verified startup only if passed
        env:
          PRIVACY_API_ONCE: api-g1
        run: python privacy-api/run.py
      - name: Validate authorized HTTP values and bootstrap receipt
        if: always()
        run: |
          python privacy-api/validate_api.py output/process-birth-http.json sanitized/process-birth-http.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path output/agent-observation-to-share.json) {
            python scripts/validate_report.py --input output/agent-observation-to-share.json --output sanitized/agent-observation-to-share.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload bounded HTTP JSON only; no packet files or keys
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: startup-api-birth-values
          path: |
            sanitized/process-birth-http.json
            sanitized/agent-observation-to-share.json
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: observe
    if: needs.observe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: privacy-observation-20261018-a1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: startup-api-birth-values
          path: incoming
      - name: Revalidate and publish HTTP values from clean runner
        run: |
          set -euo pipefail
          python privacy-api/validate_api.py incoming/process-birth-http.json reports/startup-api-g1.json
          git add -- reports/startup-api-g1.json
          if test -f incoming/agent-observation-to-share.json; then
            python scripts/validate_report.py --input incoming/agent-observation-to-share.json --output reports/startup-api-g1-bootstrap.json
            git add -- reports/startup-api-g1-bootstrap.json
          fi
          git config user.name 'privacy-lab-report'
          git config user.email 'privacy-lab-report@users.noreply.github.com'
          git commit -m 'lab: publish gated process-birth HTTP API evidence g1'
          git push origin HEAD:privacy-observation-20261018-a1
