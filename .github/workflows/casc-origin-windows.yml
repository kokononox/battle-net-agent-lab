name: Build offline CASC Windows executable
on:
  push:
    branches: [research/prelogin-telemetry-wow-data-provenance]
    paths: ['origin-check/**', '.github/workflows/casc-origin-windows.yml']
permissions: {}
concurrency:
  group: casc-origin-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: build standalone offline origin checker windows v5'
    runs-on: windows-2025
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify source contracts
        shell: pwsh
        run: |
          python -m unittest discover -s origin-check -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import tkinter; print('::notice title=bounded_build::tkinter_available=True')"
      - name: Install pinned packaging tool
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0
      - name: Build independent windowed executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name CASCOriginCheck --paths origin-check --hidden-import test_origin_check --hidden-import test_format_diagnostics --hidden-import test_key_diagnostics --hidden-import test_build_check --distpath dist --workpath build/origin --specpath build origin-check/windows_app.py
      - name: Run tests inside the built executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\CASCOriginCheck.exe -ArgumentList '--self-test', 'exe-selftest.json' -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Output '::error title=bounded_build::exe_selftest_failed'; exit 1 }
          python -c "import json; r=json.load(open('exe-selftest.json')); assert r['passed'] and r['tests_run']==59 and r['failures']==0 and r['errors']==0; print('::notice title=bounded_build::exe_selftest_passed=True')"
      - name: Make fixed-field build receipt and package
        env:
          SOURCE: ${{ github.sha }}
          RUN: ${{ github.run_id }}
        run: |
          python -c "import json,hashlib,os,pathlib,platform,shutil; p=pathlib.Path('dist/CASCOriginCheck.exe'); r=dict(schema='casc-origin-windows-build-1',source_commit=os.environ['SOURCE'],run_id=os.environ['RUN'],platform='windows-x64',tool_version='5.0',same_build_small_component_check=True,bounded_format_diagnostics=True,key_geometry_diagnostics=True,marker_acceptance_rules_changed=False,python_version=platform.python_version(),pyinstaller_version='6.16.0',exe_bytes=p.stat().st_size,exe_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),exe_selftest=json.load(open('exe-selftest.json')),unsigned=True,game_launched=False,account_login_performed=False,game_download_performed=False); pathlib.Path('dist/build-receipt.json').write_text(json.dumps(r,indent=2)+'\n'); shutil.copyfile('origin-check/README-Windows.fa.md','dist/README-Windows.fa.md')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: CASCOriginCheck-Windows-x64-v5
          path: dist/
          if-no-files-found: error
          retention-days: 14
  publish-receipt:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/prelogin-telemetry-wow-data-provenance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: CASCOriginCheck-Windows-x64-v5
          path: incoming
      - name: Publish only public executable build receipt
        env:
          SOURCE: ${{ github.sha }}
          RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path('incoming/build-receipt.json').read_text())
          assert r['source_commit']==os.environ['SOURCE'] and r['run_id']==os.environ['RUN'] and r['exe_selftest']['passed'] is True and r['unsigned'] is True
          pathlib.Path('reports/casc-origin-windows-build.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
          git config user.name prelogin-wire-report
          git config user.email prelogin-wire-report@users.noreply.github.com
          git add reports/casc-origin-windows-build.json
          git diff --cached --quiet && exit 0
          git commit -m 'lab: publish offline Windows executable build receipt'
          git push origin HEAD:research/prelogin-telemetry-wow-data-provenance
