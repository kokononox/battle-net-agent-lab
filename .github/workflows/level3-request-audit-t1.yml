name: One-shot Level3 request audit T1.1 DNS guard correction
on:
  push:
    branches: [privacy-observation-20261018-a1]
    paths:
      - 'level3-request-audit-t1/**'
      - '.github/workflows/level3-request-audit-t1.yml'
permissions: {}
jobs:
  build:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved explicit HOSTS Windows no-data guard fix t11a'
    runs-on: windows-2025
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Portable safety and recovery tests (no real hosts or Blizzard launches)
        id: units
        continue-on-error: true
        run: python -m unittest discover -s level3-request-audit-t1/tests -p 'test_*.py'
      - name: Install only exact hash-pinned instrumentation
        id: deps
        if: steps.units.outcome == 'success'
        continue-on-error: true
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r privacy-tls/requirements.txt
      - name: Build isolated portable CPython and local-only observer
        id: package
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        run: python level3-request-audit-t1/build_portable.py
      - name: Native selftest using the exact portable runtime and hook
        id: native
        if: steps.package.outcome == 'success'
        continue-on-error: true
        run: |
          $root = 'level3-request-audit-t1/release/Level3-Request-Audit-T1.1'
          & "$root/runtime/python.exe" -I "$root/app/target_monitor.py" --selftest-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$root/runtime/python.exe" -I "$root/app/target_monitor.py" --selftest-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify downloaded pinned Blizzard image signature without executing it
        id: certificate
        if: steps.package.outcome == 'success'
        continue-on-error: true
        run: python level3-request-audit-t1/certificate_gate.py
      - name: Upload portable observer only after all native gates pass
        id: portable
        if: steps.native.outcome == 'success' && steps.certificate.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Level3-Request-Audit-T1.1
          path: |
            level3-request-audit-t1/release/Level3-Request-Audit-T1.1/
            !level3-request-audit-t1/release/Level3-Request-Audit-T1.1/selftest-to-share-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Write bounded build receipt; no user data
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.units.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          CERTIFICATE_OUTCOME: ${{ steps.certificate.outcome }}
          ARTIFACT_URL: ${{ steps.portable.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.portable.outputs.artifact-digest }}
        run: python level3-request-audit-t1/build_receipt.py
      - name: Upload build receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: level3-request-audit-t11-receipt
          path: level3-request-audit-t1/build-receipt.json
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: privacy-observation-20261018-a1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: level3-request-audit-t11-receipt
          path: incoming
      - name: Validate and publish build gate receipt (not game-update success)
        run: |
          set -euo pipefail
          python level3-request-audit-t1/build_receipt.py incoming/build-receipt.json reports/level3-request-audit-t11-build.json
          git add -- reports/level3-request-audit-t11-build.json
          git config user.name 'privacy-lab-report'
          git config user.email 'privacy-lab-report@users.noreply.github.com'
          git commit -m 'lab: publish Level3 audit t11 native build gate receipt'
          git push origin HEAD:privacy-observation-20261018-a1
