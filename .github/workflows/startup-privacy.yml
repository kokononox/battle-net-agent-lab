name: One-shot Battle.net startup privacy observation
on:
  push:
    branches: [privacy-observation-20261018-a1]
    paths:
      - 'privacy-observation/**'
      - '.github/workflows/startup-privacy.yml'
permissions: {}
jobs:
  observe:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved startup privacy observation 20261018-a1'
    runs-on: windows-2025
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test existing safety gates and new sanitizer logic
        run: |
          python scripts/run_safety_tests.py --output output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s privacy-observation -p 'test_*.py'
      - name: Observe signed startup with language-only action, no install or login
        env:
          PRIVACY_ONCE: startup-privacy-20261018-a1
        run: python privacy-observation/collect.py
      - name: Whitelist evidence only
        if: always()
        run: |
          python privacy-observation/validate.py output/privacy-observation.json sanitized/privacy-observation.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate_report.py --input output/agent-observation-to-share.json --output sanitized/agent-observation-to-share.json
      - name: Upload only the two validated JSON reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: startup-privacy-sanitized
          path: |
            sanitized/privacy-observation.json
            sanitized/agent-observation-to-share.json
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: observe
    if: needs.observe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: privacy-observation-20261018-a1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: startup-privacy-sanitized
          path: incoming
      - name: Revalidate on clean runner and publish without raw logs or TLS secrets
        run: |
          set -euo pipefail
          python privacy-observation/validate.py incoming/privacy-observation.json reports/startup-privacy-20261018-a1.json
          python scripts/validate_report.py --input incoming/agent-observation-to-share.json --output reports/startup-privacy-bootstrap-20261018-a1.json
          git config user.name 'privacy-lab-report'
          git config user.email 'privacy-lab-report@users.noreply.github.com'
          git add -- reports/startup-privacy-20261018-a1.json reports/startup-privacy-bootstrap-20261018-a1.json
          git commit -m 'lab: publish sanitized startup privacy observation 20261018-a1'
          git push origin HEAD:privacy-observation-20261018-a1
