name: Battle.net G20 disposable two destination real Setup
on:
  push:
    branches: [research/battlenet-minimal-install-isolation-2026-10-25]
    paths: ['analysis-tools/two-destination-g20/**', '.github/workflows/battlenet-online-g20.yml']
permissions: {}
jobs:
  observe:
    if: >-
      github.event.head_commit.message == 'lab: approved two destination real Setup G20 20261025' && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        scenario: [real_setup]
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BNET_G20_SCENARIO: '${{ matrix.scenario }}'
      BNET_ONLINE_G20: 'lab: approved two destination real Setup G20 20261025'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse sources before any mutation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in Get-ChildItem analysis-tools/two-destination-g20/*.ps1){
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){$errors | ForEach-Object {Write-Output ($_.ErrorId+':'+$_.Extent.StartLineNumber)};throw 'powershell_parse_failed'}
          }
          python -m compileall -q analysis-tools/two-destination-g20
          if($LASTEXITCODE -ne 0){throw 'python_parse_failed'}
      - name: Negative classifier and recovery-decision tests without OS mutation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python analysis-tools/two-destination-g20/TestClassifier.py --synthetic output
          if($LASTEXITCODE -ne 0){throw 'classifier_unit_tests_failed'}
          & ./analysis-tools/two-destination-g20/TestGate.ps1
          python analysis-tools/two-destination-g20/TestProxy.py
          if($LASTEXITCODE -ne 0){throw 'proxy_protocol_tests_failed'}
      - name: Compile bounded Job launcher and native signature verifier
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force output, "$env:RUNNER_TEMP\bnet-g20-bin" | Out-Null
          $source=(Resolve-Path 'analysis-tools/two-destination-g20/OfflineLauncher.cs').Path
          $signature=(Resolve-Path 'scripts/authenticode_native.cs').Path
          $csc="$env:SystemRoot\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc @('/nologo','/target:exe','/platform:x64','/r:System.Web.Extensions.dll',('/out:'+(Join-Path "$env:RUNNER_TEMP\bnet-g20-bin" 'OfflineLauncher.exe')),$source,$signature)
          if($LASTEXITCODE -ne 0){throw 'launcher_build_failed'}
          Push-Location analysis-tools/two-destination-g20
          try {
            python -m pip install --disable-pip-version-check pyinstaller==6.16.0
            if($LASTEXITCODE -ne 0){throw 'proxy_dependency_failed'}
            python -m PyInstaller --clean --noconfirm --onedir --name TwoHostProxy domain_proxy.py
            if($LASTEXITCODE -ne 0){throw 'proxy_build_failed'}
          } finally {Pop-Location}
      - name: Observe pinned real Setup through exact host Job proxy
        timeout-minutes: 6
        shell: powershell
        run: '& ./analysis-tools/two-destination-g20/Driver.ps1'
      - name: Bounded component-first fallback, never unconditional policy release
        if: always()
        timeout-minutes: 1
        shell: powershell
        run: |
          if(Test-Path output/g20-private-pointer.json){
            $p=Get-Content -Raw output/g20-private-pointer.json | ConvertFrom-Json
            if(Test-Path (Join-Path $p.root 'before.wfw')){
              & {
                . (Join-Path $p.root 'Common.ps1')
                $c=Read-Context (Join-Path $p.root 'config.json')
                if((Get-Content -Raw (Join-Path $p.root 'lease.json') | ConvertFrom-Json).phase -ne 'released'){
                  Start-ScheduledTask $c.cleanup_task_name
                  Wait-File (Join-Path $p.root 'recovery-result.json') 40
                }
              }
            }
          }
      - name: Build only allowlisted evidence
        if: always()
        shell: powershell
        run: 'python analysis-tools/two-destination-g20/Reporter.py'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: 'battlenet-online-g20b-${{ matrix.scenario }}-sanitized'
          path: output/online-g20.json
          if-no-files-found: error
          retention-days: 3
