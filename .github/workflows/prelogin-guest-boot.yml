name: Pause legacy nested guest route - no VM or target execution
on:
  push:
    branches: [research/prelogin-telemetry-wow-data-provenance]
    paths: ['.github/workflows/prelogin-guest-boot.yml']
permissions: {}
# Same workflow-level group as the old route, requesting cancellation, not a new VM.
concurrency:
  group: owned-guest-boot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pause:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: pause nested guest route and return to direct trace'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/prelogin-telemetry-wow-data-provenance
      - name: Publish route pause receipt only
        env:
          SOURCE: ${{ github.sha }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          source=os.environ['SOURCE'];run=os.environ['RUN']
          if not re.fullmatch('[a-f0-9]{40}',source) or not re.fullmatch('[0-9]{1,30}',run):raise SystemExit('invalid_identity')
          r=dict(schema='bnet-route-pause-1',source_commit=source,run_id=run,route='nested_windows_guest',state='paused',pause_job_started=True,previous_run_cancellation_requested=True,previous_run_terminal_status_verified=False,new_guest_launched=False,target_launched=False,remote_access_enabled=False)
          Path('reports/guest-boot-route-status.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
          git config user.name prelogin-wire-report
          git config user.email prelogin-wire-report@users.noreply.github.com
          git add -- reports/guest-boot-route-status.json
          git commit -m 'lab: publish nested route pause receipt'
          git push origin HEAD:research/prelogin-telemetry-wow-data-provenance
