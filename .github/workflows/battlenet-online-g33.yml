name: Battle.net G33 ambient task control without Setup execution
on:
  push:
    branches: [research/battlenet-minimal-install-isolation-2026-10-25]
    paths: ['analysis-tools/two-destination-g33/**', '.github/workflows/battlenet-online-g33.yml']
permissions: {}
jobs:
  observe:
    if: >-
      github.event.head_commit.message == 'lab: approved ambient no Setup control G33 20261025' && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        scenario: [ambient_no_setup]
    runs-on: windows-2025
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      BNET_G33_SCENARIO: '${{ matrix.scenario }}'
      BNET_ONLINE_G33: 'lab: approved ambient no Setup control G33 20261025'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse sources before any mutation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in Get-ChildItem analysis-tools/two-destination-g33/*.ps1){
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){$errors | ForEach-Object {Write-Output ($_.ErrorId+':'+$_.Extent.StartLineNumber)};throw 'powershell_parse_failed'}
          }
          python -m compileall -q analysis-tools/two-destination-g33
          if($LASTEXITCODE -ne 0){throw 'python_parse_failed'}
      - name: Scoped diagnostic channel probe before build
        shell: powershell
        run: |
          . ./analysis-tools/two-destination-g33/TaskAudit.ps1
          . ./analysis-tools/two-destination-g33/DiagnosticLog.ps1
          Start-DiagnosticLog
      - name: Negative classifier and recovery-decision tests without OS mutation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python analysis-tools/two-destination-g33/TestClassifier.py --synthetic output
          if($LASTEXITCODE -ne 0){throw 'classifier_unit_tests_failed'}
          & ./analysis-tools/two-destination-g33/TestGate.ps1
          python analysis-tools/two-destination-g33/TestProxy.py
          if($LASTEXITCODE -ne 0){throw 'proxy_protocol_tests_failed'}
          python analysis-tools/two-destination-g33/TestDiagnostics.py
          if($LASTEXITCODE -ne 0){throw 'proxy_diagnostic_tests_failed'}
          python -I analysis-tools/two-destination-g33/TestEnforcedTimeRules.py --unit output
          if($LASTEXITCODE -ne 0){throw 'enforced_time_rules_unit_tests_failed'}
          python analysis-tools/two-destination-g33/TestShadowSchedule.py
          if($LASTEXITCODE -ne 0){throw 'shadow_schedule_tests_failed'}
          python analysis-tools/two-destination-g33/TestFocusTasks.py
          if($LASTEXITCODE -ne 0){throw 'focus_task_tests_failed'}
          python analysis-tools/two-destination-g33/TestCriticalEvidence.py
          if($LASTEXITCODE -ne 0){throw 'critical_receipt_tests_failed'}
          python analysis-tools/two-destination-g33/TestCollectReport.py
          if($LASTEXITCODE -ne 0){throw 'report_collector_tests_failed'}
          python analysis-tools/two-destination-g33/TestTLSRecords.py
          if($LASTEXITCODE -ne 0){throw 'tls_metadata_tests_failed'}
          python analysis-tools/two-destination-g33/TestLogErrors.py
          if($LASTEXITCODE -ne 0){throw 'log_code_tests_failed'}
          python analysis-tools/two-destination-g33/TestPeerLive.py
          if($LASTEXITCODE -ne 0){throw 'native_peer_table_tests_failed'}
      - name: Compile no-launch canary and signature helper
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force output, "$env:RUNNER_TEMP\bnet-g33-bin" | Out-Null
          $source=(Resolve-Path 'analysis-tools/two-destination-g33/OfflineLauncher.cs').Path
          $signature=(Resolve-Path 'scripts/authenticode_native.cs').Path
          $csc="$env:SystemRoot\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc @('/nologo','/target:exe','/platform:x64','/r:System.Web.Extensions.dll',('/out:'+(Join-Path "$env:RUNNER_TEMP\bnet-g33-bin" 'OfflineLauncher.exe')),$source,$signature)
          if($LASTEXITCODE -ne 0){throw 'launcher_build_failed'}
          $prep=(Resolve-Path 'analysis-tools/two-destination-g33/CertificatePrep.cs').Path
          & $csc @('/nologo','/target:exe','/platform:x64','/r:System.Web.Extensions.dll',('/out:'+(Join-Path "$env:RUNNER_TEMP\bnet-g33-bin" 'CertificatePrep.exe')),$prep)
          if($LASTEXITCODE -ne 0){throw 'certificate_prep_build_failed'}
          & (Join-Path "$env:RUNNER_TEMP\bnet-g33-bin" 'CertificatePrep.exe') selftest
          if($LASTEXITCODE -ne 0){throw 'certificate_policy_tests_failed'}
          Push-Location analysis-tools/two-destination-g33
          try {
            python -m pip install --disable-pip-version-check pyinstaller==6.16.0
            if($LASTEXITCODE -ne 0){throw 'proxy_dependency_failed'}
            python -m PyInstaller --clean --noconfirm --onedir --name TwoHostProxy domain_proxy.py
            if($LASTEXITCODE -ne 0){throw 'proxy_build_failed'}
          } finally {Pop-Location}
      - name: Observe ambient tasks without executing Setup
        timeout-minutes: 8
        shell: powershell
        run: '& ./analysis-tools/two-destination-g33/Driver.ps1'
      - name: Bounded component-first fallback, never unconditional policy release
        if: always()
        timeout-minutes: 1
        shell: powershell
        run: |
          if(Test-Path output/g33-private-pointer.json){
            $p=Get-Content -Raw output/g33-private-pointer.json | ConvertFrom-Json
            if(Test-Path (Join-Path $p.root 'before.wfw')){
              & {
                . (Join-Path $p.root 'Common.ps1')
                $c=Read-Context (Join-Path $p.root 'config.json')
                if((Get-Content -Raw (Join-Path $p.root 'lease.json') | ConvertFrom-Json).phase -ne 'released'){
                  Start-ScheduledTask $c.cleanup_task_name
                  Wait-File (Join-Path $p.root 'recovery-result.json') 40
                }
              }
            }
          }
      - name: Build only allowlisted evidence
        if: always()
        shell: powershell
        run: |
          if(Test-Path output/g33-private-pointer.json){
            $p=Get-Content -Raw output/g33-private-pointer.json | ConvertFrom-Json
            . ./analysis-tools/two-destination-g33/DiagnosticLog.ps1
            Stop-DiagnosticLog $p.root
            python analysis-tools/two-destination-g33/FocusSummary.py $p.root
          }
          python analysis-tools/two-destination-g33/Reporter.py
      - name: Restore diagnostic channel state
        if: always()
        shell: powershell
        run: |
          . ./analysis-tools/two-destination-g33/DiagnosticLog.ps1
          Stop-DiagnosticLog ''
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: 'battlenet-online-g33-${{ matrix.scenario }}-sanitized'
          path: |
            output/online-g33.json
            output/core-g33.json
          if-no-files-found: error
          retention-days: 3

  collect:
    needs: observe
    if: >-
      always() && github.event.head_commit.message == 'lab: approved ambient no Setup control G33 20261025' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recover verified sanitized evidence from finished Windows job
        env:
          GH_REPORT_TOKEN: ${{ github.token }}
        run: python analysis-tools/two-destination-g33/CollectReport.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: battlenet-online-g33-recovered-sanitized
          path: collected/*.json
          if-no-files-found: error
          retention-days: 14
