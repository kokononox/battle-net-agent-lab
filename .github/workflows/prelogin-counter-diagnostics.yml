name: Read-only Windows counter diagnostics (no Battle.net target)
on:
  push:
    branches: [research/prelogin-telemetry-wow-data-provenance]
    paths:
      - 'analysis-tools/prelogin-retail-prepare/**'
      - '.github/workflows/prelogin-counter-diagnostics.yml'
permissions: {}
concurrency:
  group: prelogin-counter-diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved counter diagnostics d1'
    runs-on: windows-2025
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Local contracts (no target)
        run: |
          python -m unittest discover -s analysis-tools/prelogin-retail-prepare -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile guard but run only assertions and adapter-counter probe
        env:
          COUNTER_DIAGNOSTIC: approved-counter-diagnostics-d1
        run: python analysis-tools/prelogin-retail-prepare/counter_driver.py
      - name: Strict typed report only
        if: always()
        run: python analysis-tools/prelogin-retail-prepare/counter_report.py output/counter-diagnostic-run.json sanitized/counter-diagnostic-run.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: read-only-counter-diagnostic
          path: sanitized/counter-diagnostic-run.json
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: diagnose
    if: >-
      always() && github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved counter diagnostics d1'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/prelogin-telemetry-wow-data-provenance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: read-only-counter-diagnostic
          path: incoming-counter
      - name: Revalidate identity and publish a single fixed report path
        env:
          SOURCE: ${{ github.sha }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 analysis-tools/prelogin-retail-prepare/counter_report.py incoming-counter/counter-diagnostic-run.json reports/prelogin-counter-diagnostic-latest.json "$SOURCE" "$RUN"
          git config user.name prelogin-wire-report
          git config user.email prelogin-wire-report@users.noreply.github.com
          git add -- reports/prelogin-counter-diagnostic-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'lab: publish read-only counter diagnostic receipt'
          git push origin HEAD:research/prelogin-telemetry-wow-data-provenance
