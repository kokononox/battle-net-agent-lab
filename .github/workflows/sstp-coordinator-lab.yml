name: One-shot scoped unified coordinator and guard release gate
on:
  push:
    branches: [privacy-observation-20261018-a1]
    paths: ['sstp-coordinator-lab/**', '.github/workflows/sstp-coordinator-lab.yml']
permissions: {}
jobs:
  coordinator_tests:
    if: "${{ github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'lab: approved scoped unified coordinator p12') }}"
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse and test scoped unified coordinator
        id: native
        continue-on-error: true
        shell: powershell
        run: |
          foreach($f in Get-ChildItem 'sstp-coordinator-lab' -Filter '*.ps1') {
            $tokens=$null;$errors=$null
            $ast=[Management.Automation.Language.Parser]::ParseFile($f.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0) { throw 'coord_parse_error' }
            $text=[IO.File]::ReadAllText($f.FullName)
            if($text -match '(?i)Set-NetConnectionProfile|Set-VpnConnection|Register-ScheduledTask|advfirewall|Set-ItemProperty|Remove-ItemProperty|Invoke-WebRequest|Resolve-DnsName') { throw 'coord_forbidden_operation' }
            foreach($cmd in $ast.FindAll({param($n) $n -is [Management.Automation.Language.CommandAst] -and $n.GetCommandName() -eq 'Set-NetFirewallProfile'},$true)) {
              $names=@($cmd.CommandElements|Where-Object{$_ -is [Management.Automation.Language.CommandParameterAst]}|ForEach-Object{$_.ParameterName})
              if($names.Count -ne 3 -or 'InputObject' -notin $names -or 'DefaultOutboundAction' -notin $names -or 'ErrorAction' -notin $names) { throw 'coord_profile_setter_scope' }
            }
          }
          & './sstp-coordinator-lab/Test-Coordinator.ps1' -OutputPath (Join-Path $env:RUNNER_TEMP 'coordinator.json')
          if($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate bounded receipt only
        if: always()
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: python sstp-coordinator-lab/receipt.py
      - name: Upload bounded receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sstp-coordinator-lab-receipt
          path: sstp-coordinator-lab/build-receipt.json
          retention-days: 3
          if-no-files-found: error
