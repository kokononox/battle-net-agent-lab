name: One-shot bounded startup network metadata
on:
  push:
    branches: [privacy-observation-20261018-a1]
    paths:
      - 'privacy-network/**'
      - '.github/workflows/startup-network.yml'
permissions: {}
jobs:
  observe:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved bounded startup network capture 20261018-b1'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test safety and packet metadata sanitizer before capture
        run: |
          python scripts/run_safety_tests.py --output output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s privacy-network -p 'test_*.py'
      - name: Capture short startup only; no install, account or game request
        env:
          PRIVACY_NETWORK_ONCE: network-20261018-b1
        run: python privacy-network/collect.py
      - name: Validate only metadata and optional bootstrap receipt
        if: always()
        run: |
          python privacy-network/validate.py output/network-metadata.json sanitized/network-metadata.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path output/agent-observation-to-share.json) {
            python scripts/validate_report.py --input output/agent-observation-to-share.json --output sanitized/agent-observation-to-share.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload whitelist JSON only; no packet files or keys
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: startup-network-sanitized
          path: |
            sanitized/network-metadata.json
            sanitized/agent-observation-to-share.json
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: observe
    if: needs.observe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: privacy-observation-20261018-a1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: startup-network-sanitized
          path: incoming
      - name: Revalidate and publish metadata from clean runner
        run: |
          set -euo pipefail
          python privacy-network/validate.py incoming/network-metadata.json reports/startup-network-20261018-b1.json
          git add -- reports/startup-network-20261018-b1.json
          if test -f incoming/agent-observation-to-share.json; then
            python scripts/validate_report.py --input incoming/agent-observation-to-share.json --output reports/startup-network-bootstrap-20261018-b1.json
            git add -- reports/startup-network-bootstrap-20261018-b1.json
          fi
          git config user.name 'privacy-lab-report'
          git config user.email 'privacy-lab-report@users.noreply.github.com'
          git commit -m 'lab: publish sanitized startup network metadata 20261018-b1'
          git push origin HEAD:privacy-observation-20261018-a1
