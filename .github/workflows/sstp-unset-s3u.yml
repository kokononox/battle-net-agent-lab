name: One-shot S3U CI-only exact local unset round-trip qualification
on:
  push:
    branches: [privacy-observation-20261018-a1]
    paths:
      - 'sstp-unset-s3u/**'
      - '.github/workflows/sstp-unset-s3u.yml'
permissions: {}
jobs:
  validate:
    if: "${{ github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved ephemeral Windows unset roundtrip s3u3-diagnostic' }}"
    runs-on: windows-2025
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Locate runner diagnostic directories without printing paths
        shell: powershell
        run: |
          $roots=@();$version=$null
          foreach ($proc in @(Get-Process -Name Runner.Listener,Runner.Worker -ErrorAction SilentlyContinue)) {
            try {
              $exe=$proc.Path
              if ($exe) {
                $root=Split-Path (Split-Path $exe -Parent) -Parent
                $diag=Join-Path $root '_diag'
                if ((Test-Path -LiteralPath $diag) -and $roots -notcontains $diag) { $roots+=,$diag }
                $v=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion
                if ($v -match '^[0-9.]{1,40}$') { $version=$v }
              }
            } catch {}
          }
          $meta=[ordered]@{roots=@($roots | Select-Object -First 2);cutoff_utc=[DateTime]::UtcNow.ToString('o');runner_version=$version}
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 's3u-private-diag-roots.json'),($meta | ConvertTo-Json -Depth 4),(New-Object Text.UTF8Encoding($false)))
      - name: Parse and qualify provider unset roundtrip on ephemeral CI only
        id: native
        continue-on-error: true
        shell: powershell
        run: |
          $root=(Resolve-Path 'sstp-unset-s3u').Path
          foreach ($file in Get-ChildItem $root -Filter '*.ps1') {
            $tokens=$null;$errors=$null
            $ast=[Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) {
              $e=[ordered]@{file=$file.Name;error_ids=@($errors | ForEach-Object { $_.ErrorId });lines=@($errors | ForEach-Object { $_.Extent.StartLineNumber })}
              [IO.File]::WriteAllText((Join-Path $root 'parse-error.json'),($e | ConvertTo-Json -Depth 6),(New-Object Text.UTF8Encoding($false)))
              throw 's3_parse_error'
            }
            $text=[IO.File]::ReadAllText($file.FullName)
            if ($text -match '(?i)advfirewall\s+(import|reset)|Remove-VpnConnection|Set-VpnConnection|rasdial|rasphone|Set-ExecutionPolicy|Stop-Process|CreateSubKey|DeleteSubKey|DeleteValue|SetValue|New-NetFirewallRule|Remove-NetFirewallRule|Set-NetFirewallRule') { throw 's3_forbidden_operation' }
          }
          $ps=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $ps -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'Run-CI.ps1')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write bounded receipt, never private journal or policy
        if: always()
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: python sstp-unset-s3u/validate_receipt.py
      - name: Extract fixed diagnostic counters only, never raw runner logs
        if: always()
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: python sstp-unset-s3u/collect_runner_signals.py
      - name: Upload receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sstp-unset-s3u-receipt
          path: |
            sstp-unset-s3u/build-receipt.json
            sstp-unset-s3u/control-diagnostic.json
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: validate
    if: always() && needs.validate.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sstp-unset-s3u-receipt
          path: incoming
      - name: Validate and publish receipt
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python sstp-unset-s3u/validate_receipt.py incoming/build-receipt.json reports/sstp-unset-s3u-build.json
          python -c "import json,os; r=json.load(open('reports/sstp-unset-s3u-build.json')); assert r['source_commit']==os.environ['EXPECTED_COMMIT'] and r['run_id']==os.environ['EXPECTED_RUN_ID'], 'receipt_identity_mismatch'"
          python sstp-unset-s3u/collect_runner_signals.py --validate incoming/control-diagnostic.json reports/sstp-control-diagnostic.json
          git add -- reports/sstp-unset-s3u-build.json reports/sstp-control-diagnostic.json
          git config user.name 'privacy-lab-report'
          git config user.email 'privacy-lab-report@users.noreply.github.com'
          git commit -m 'lab: publish S3U local unset qualification CI receipt'
          git push origin HEAD:privacy-observation-20261018-a1
