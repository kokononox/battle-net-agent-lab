name: One-shot restore known-good 1536-byte NIC capture mode
on:
  push:
    branches: [privacy-observation-20261018-a1]
    paths:
      - 'privacy-http/**'
      - '.github/workflows/startup-http-prefix.yml'
permissions: {}
jobs:
  observe:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved bounded HTTP prefix capture f4'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test safety and full HTTP reassembly before capture
        run: |
          python scripts/run_safety_tests.py --output output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s privacy-network -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s privacy-http -p 'test_*.py'
      - name: Capture short startup only; no install, account or game request
        env:
          PRIVACY_HTTP_ONCE: http-f4
        run: python privacy-http/run_f4.py
      - name: Validate authorized HTTP values and bootstrap receipt
        if: always()
        run: |
          python privacy-http/validate_http.py output/outgoing-http-f4.json sanitized/outgoing-http-f4.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path output/agent-observation-to-share.json) {
            python scripts/validate_report.py --input output/agent-observation-to-share.json --output sanitized/agent-observation-to-share.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload bounded HTTP JSON only; no packet files or keys
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: startup-http-f4-values
          path: |
            sanitized/outgoing-http-f4.json
            sanitized/agent-observation-to-share.json
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: observe
    if: needs.observe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: privacy-observation-20261018-a1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: startup-http-f4-values
          path: incoming
      - name: Revalidate and publish HTTP values from clean runner
        run: |
          set -euo pipefail
          python privacy-http/validate_http.py incoming/outgoing-http-f4.json reports/startup-http-f4.json
          git add -- reports/startup-http-f4.json
          if test -f incoming/agent-observation-to-share.json; then
            python scripts/validate_report.py --input incoming/agent-observation-to-share.json --output reports/startup-http-f4-bootstrap.json
            git add -- reports/startup-http-f4-bootstrap.json
          fi
          git config user.name 'privacy-lab-report'
          git config user.email 'privacy-lab-report@users.noreply.github.com'
          git commit -m 'lab: publish bounded HTTP prefix evidence f4'
          git push origin HEAD:privacy-observation-20261018-a1
