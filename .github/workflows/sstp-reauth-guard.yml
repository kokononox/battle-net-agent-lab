name: One-shot scoped existing-flow reauthorization guard lab
on:
  push:
    branches: [privacy-observation-20261018-a1]
    paths: ['sstp-reauth-guard/**', '.github/workflows/sstp-reauth-guard.yml']
permissions: {}
jobs:
  netluid_tests:
    if: "${{ github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'lab: approved scoped reauth guard p15') }}"
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile and test scoped existing-flow reauthorization guard
        id: native
        continue-on-error: true
        shell: powershell
        run: |
          foreach($f in Get-ChildItem 'sstp-reauth-guard' -Filter '*.ps1') {
            $tokens=$null;$errors=$null
            $ast=[Management.Automation.Language.Parser]::ParseFile($f.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0) { throw 'wfp_parse_error' }
            if([IO.File]::ReadAllText($f.FullName) -match '(?i)Set-NetFirewall|New-NetFirewall|Remove-NetFirewall|Set-NetConnectionProfile|Set-VpnConnection|Register-ScheduledTask|Stop-Service|Restart-Service|Restart-Computer|Set-Service|advfirewall|Set-ItemProperty|Remove-ItemProperty|Invoke-WebRequest') { throw 'wfp_forbidden_operation' }
          }
          & './sstp-reauth-guard/Test-Wfp.ps1' -OutputPath (Join-Path $env:RUNNER_TEMP 'reauth.json')
          if($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate bounded receipt only
        if: always()
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: python sstp-reauth-guard/receipt.py
      - name: Upload bounded receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sstp-reauth-guard-receipt
          path: sstp-reauth-guard/build-receipt.json
          retention-days: 3
          if-no-files-found: error
