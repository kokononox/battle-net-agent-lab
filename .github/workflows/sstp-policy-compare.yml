name: One-shot complete firewall inventory and comparison qualification
on:
  push:
    branches: [privacy-observation-20261018-a1]
    paths: ['sstp-policy-compare/**', '.github/workflows/sstp-policy-compare.yml']
permissions: {}
jobs:
  inventory_tests:
    if: "${{ github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'lab: approved read-only full policy comparison p8') }}"
    runs-on: windows-2025
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse and qualify readonly full policy comparison
        id: native
        continue-on-error: true
        shell: powershell
        run: |
          foreach($f in Get-ChildItem 'sstp-policy-compare' -Filter '*.ps1') {
            $tokens=$null;$errors=$null
            $ast=[Management.Automation.Language.Parser]::ParseFile($f.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0) { throw 'inventory_parse_error' }
            $text=[IO.File]::ReadAllText($f.FullName)
            if($text -match '(?i)(New|Set|Enable|Disable|Remove)-NetFirewall|Set-VpnConnection|Resolve-DnsName|GetHostAddresses|Invoke-WebRequest|Invoke-Expression|Register-ScheduledTask|Start-Process|Import-Module|Invoke-Command|advfirewall|rasdial|HttpClient') { throw 'inventory_forbidden_operation' }
          }
          & './sstp-policy-compare/Test-Inventory.ps1' -OutputPath (Join-Path $env:RUNNER_TEMP 'policy-compare.json')
          if($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate bounded receipt only
        if: always()
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: python sstp-policy-compare/receipt.py
      - name: Upload bounded receipt, never raw policy
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sstp-policy-compare-receipt
          path: sstp-policy-compare/build-receipt.json
          retention-days: 3
          if-no-files-found: error
