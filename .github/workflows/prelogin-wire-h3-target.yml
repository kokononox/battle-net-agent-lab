name: Bounded pre-login H3 with fresh x86 x64 qualification
on:
  push:
    branches: [research/prelogin-telemetry-wow-data-provenance]
    paths:
      - 'analysis-tools/prelogin-wire-h3/**'
      - '.github/workflows/prelogin-wire-h3-target.yml'
permissions: {}
concurrency:
  group: prelogin-wire-h3-target-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved prelogin wire h3 20261024-e2'
    runs-on: windows-2025
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Existing safety tests plus H3 callback and target failure-mode tests
        run: |
          python scripts/run_safety_tests.py --output output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s analysis-tools/prelogin-wire-h2 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s analysis-tools/prelogin-wire-h3 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned observation dependencies
        run: python -m pip install --disable-pip-version-check frida==17.24.2 protobuf==6.33.0
      - name: Native HTTPS wire gate then signed pinned startup only
        env:
          BNET_WIRE_H3: approved-wire-h3-20261024-e2
        run: python analysis-tools/prelogin-wire-h3/target_run.py
      - name: Strictly validate only the shareable summary
        if: always()
        run: python analysis-tools/prelogin-wire-h3/target_validate.py output/prelogin-wire-h3-target.json sanitized/prelogin-wire-h3-target.json
      - name: Upload summary only, never ETL PCAP TLS buffers or binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: prelogin-wire-h3-target-summary
          path: sanitized/prelogin-wire-h3-target.json
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: observe
    if: needs.observe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/prelogin-telemetry-wow-data-provenance
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: prelogin-wire-h3-target-summary
          path: incoming
      - name: Revalidate on clean runner and publish fixed-path JSON only
        run: |
          set -euo pipefail
          python analysis-tools/prelogin-wire-h3/target_validate.py incoming/prelogin-wire-h3-target.json reports/prelogin-wire-h3-target-runtime.json
          git config user.name prelogin-wire-report
          git config user.email prelogin-wire-report@users.noreply.github.com
          git add -- reports/prelogin-wire-h3-target-runtime.json
          git diff --cached --quiet && exit 0
          git commit -m 'lab: publish sanitized prelogin wire H3 target runtime evidence'
          git push origin HEAD:research/prelogin-telemetry-wow-data-provenance
