name: Owned reboot-probe controls only - no actual reboot or Battle.net
on:
  push:
    branches: [research/prelogin-telemetry-wow-data-provenance]
    paths:
      - 'analysis-tools/prelogin-reboot/**'
      - '.github/workflows/prelogin-reboot-control.yml'
permissions: {}
concurrency:
  group: reboot-probe-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  control:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved owned reboot controls b1'
    runs-on: windows-2025
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Unit controls - positive cases are synthetic only
        run: python -m unittest discover -s analysis-tools/prelogin-reboot -p 'test_*.py' -v
      - name: Real Windows DPAPI and same-boot rejection only
        env:
          BNET_REBOOT_CONTROL: owned-no-reboot-b1
        run: python analysis-tools/prelogin-reboot/native_control.py
      - name: Strictly validate shareable control summary
        if: always()
        run: python analysis-tools/prelogin-reboot/native_control.py validate output/reboot-native-control.json sanitized/reboot-native-control.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reboot-probe-controls-only
          path: sanitized/reboot-native-control.json
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: control
    if: needs.control.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/prelogin-telemetry-wow-data-provenance
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: reboot-probe-controls-only
          path: incoming
      - name: Publish only validated controls, never private state
        run: |
          set -euo pipefail
          python analysis-tools/prelogin-reboot/native_control.py validate incoming/reboot-native-control.json reports/prelogin-reboot-control-runtime.json
          git config user.name prelogin-wire-report
          git config user.email prelogin-wire-report@users.noreply.github.com
          git add -- reports/prelogin-reboot-control-runtime.json
          git diff --cached --quiet && exit 0
          git commit -m 'lab: publish owned reboot controls - no reboot claim'
          git push origin HEAD:research/prelogin-telemetry-wow-data-provenance
