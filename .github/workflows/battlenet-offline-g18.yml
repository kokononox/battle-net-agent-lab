name: Battle.net G18 matched no-Setup control and private BITS observation
on:
  push:
    branches: [research/battlenet-minimal-install-isolation-2026-10-25]
    paths: ['analysis-tools/offline-control-g18/**', '.github/workflows/battlenet-offline-g18.yml']
permissions: {}
jobs:
  observe:
    if: >-
      github.event.head_commit.message == 'lab: approved matched offline BITS G18 20261025' && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        scenario: [real_setup]
    runs-on: windows-2025
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      BNET_G18_SCENARIO: '${{ matrix.scenario }}'
      BNET_OFFLINE_G18: 'lab: approved matched offline BITS G18 20261025'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse sources before any mutation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in Get-ChildItem analysis-tools/offline-control-g18/*.ps1){
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){$errors | ForEach-Object {Write-Output ($_.ErrorId+':'+$_.Extent.StartLineNumber)};throw 'powershell_parse_failed'}
          }
          python -m compileall -q analysis-tools/offline-control-g18
          if($LASTEXITCODE -ne 0){throw 'python_parse_failed'}
      - name: Compile bounded Job launcher and native signature verifier
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force output, "$env:RUNNER_TEMP\bnet-g18-bin" | Out-Null
          $source=(Resolve-Path 'analysis-tools/offline-control-g18/OfflineLauncher.cs').Path
          $signature=(Resolve-Path 'scripts/authenticode_native.cs').Path
          $csc="$env:SystemRoot\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc @('/nologo','/target:exe','/platform:x64','/r:System.Web.Extensions.dll',('/out:'+(Join-Path "$env:RUNNER_TEMP\bnet-g18-bin" 'OfflineLauncher.exe')),$source,$signature)
          if($LASTEXITCODE -ne 0){throw 'launcher_build_failed'}
      - name: Observe pinned real Setup with target outbound closed
        timeout-minutes: 4
        shell: powershell
        run: '& ./analysis-tools/offline-control-g18/Driver.ps1'
      - name: Bounded component-first fallback, never unconditional policy release
        if: always()
        timeout-minutes: 1
        shell: powershell
        run: |
          if(Test-Path output/g18-private-pointer.json){
            $p=Get-Content -Raw output/g18-private-pointer.json | ConvertFrom-Json
            if(Test-Path (Join-Path $p.root 'before.wfw')){
              & {
                . (Join-Path $p.root 'Common.ps1')
                $c=Read-Context (Join-Path $p.root 'config.json')
                if((Get-Content -Raw (Join-Path $p.root 'lease.json') | ConvertFrom-Json).phase -ne 'released'){
                  Start-ScheduledTask $c.cleanup_task_name
                  Wait-File (Join-Path $p.root 'recovery-result.json') 40
                }
              }
            }
          }
      - name: Build only allowlisted evidence
        if: always()
        shell: powershell
        run: 'python analysis-tools/offline-control-g18/Reporter.py'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: 'battlenet-offline-g18a-${{ matrix.scenario }}-sanitized'
          path: output/offline-g18.json
          if-no-files-found: error
          retention-days: 3
