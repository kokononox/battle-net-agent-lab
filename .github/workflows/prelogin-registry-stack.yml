name: Direct prelogin UserUUID accurate main-image stack trace
on:
  push:
    branches: [research/prelogin-telemetry-wow-data-provenance]
    paths:
      - 'analysis-tools/prelogin-registry-stack/**'
      - '.github/workflows/prelogin-registry-stack.yml'
permissions: {}
concurrency:
  group: prelogin-registry-stack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dispatch:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved registry stack a12b'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/prelogin-telemetry-wow-data-provenance
      - name: Publish typed start receipt only
        env:
          SOURCE: ${{ github.sha }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 analysis-tools/prelogin-registry-stack/ci_status.py reports/prelogin-registry-stack-ci.json "$SOURCE" "$RUN" dispatched
          git config user.name prelogin-wire-report
          git config user.email prelogin-wire-report@users.noreply.github.com
          git add -- reports/prelogin-registry-stack-ci.json
          git commit -m 'lab: publish direct registry stack start receipt'
          git push origin HEAD:research/prelogin-telemetry-wow-data-provenance
  observe:
    needs: dispatch
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved registry stack a12b'
    runs-on: windows-2025
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned observation dependencies
        id: dependencies
        run: python -m pip install --disable-pip-version-check frida==17.24.2 protobuf==6.33.0
      - name: Existing safety and native contracts plus private equality tests
        id: contracts
        run: |
          python scripts/run_safety_tests.py --output output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s analysis-tools/prelogin-wire-h2 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s analysis-tools/prelogin-wire-h3 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s analysis-tools/prelogin-host-lifecycle -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s analysis-tools/prelogin-registry-stack -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node analysis-tools/prelogin-registry-stack/contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native registry and wire gates then two pinned pre-login startups
        id: observation
        timeout-minutes: 14
        env:
          BNET_REGISTRY_TRACE: approved-registry-stack-a12b
        run: python analysis-tools/prelogin-registry-stack/run_registry.py
      - name: Strictly validate fixed-key registry summary
        id: sanitize
        if: always()
        run: python analysis-tools/prelogin-registry-stack/validate_registry.py output/prelogin-registry-stack-runtime.json sanitized/prelogin-registry-stack-runtime.json
      - name: Strictly validate only the shareable summary
        if: always()
        run: |
          if (Test-Path output/prelogin-host-lifecycle.json) {
            python analysis-tools/prelogin-host-lifecycle/validate_lifecycle.py output/prelogin-host-lifecycle.json sanitized/prelogin-host-lifecycle.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Strictly validate first-phase qualification diagnostics
        if: always()
        run: |
          if (Test-Path output/prelogin-wire-h3-target.json) {
            python analysis-tools/prelogin-wire-h3/target_validate.py output/prelogin-wire-h3-target.json sanitized/prelogin-host-lifecycle-first-phase.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Record typed CI outcomes even when no target report exists
        if: always()
        env:
          SOURCE: ${{ github.sha }}
          RUN: ${{ github.run_id }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          CONTRACTS: ${{ steps.contracts.outcome }}
          OBSERVATION: ${{ steps.observation.outcome }}
          SANITIZATION: ${{ steps.sanitize.outcome }}
        run: python analysis-tools/prelogin-registry-stack/ci_status.py sanitized/prelogin-registry-stack-ci.json "$env:SOURCE" "$env:RUN" completed "$env:DEPENDENCIES" "$env:CONTRACTS" "$env:OBSERVATION" "$env:SANITIZATION"
      - name: Upload summary only, never ETL PCAP TLS buffers or binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: prelogin-registry-stack-summary
          path: sanitized/
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: [dispatch, observe]
    if: always() && needs.dispatch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/prelogin-telemetry-wow-data-provenance
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: prelogin-registry-stack-summary
          path: incoming
      - name: Revalidate on clean runner and publish fixed-path JSON only
        env:
          SOURCE: ${{ github.sha }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -f incoming/prelogin-host-lifecycle.json ]; then python analysis-tools/prelogin-host-lifecycle/validate_lifecycle.py incoming/prelogin-host-lifecycle.json reports/prelogin-host-lifecycle-runtime.json; fi
          if [ -f incoming/prelogin-host-lifecycle-first-phase.json ]; then python analysis-tools/prelogin-wire-h3/target_validate.py incoming/prelogin-host-lifecycle-first-phase.json reports/prelogin-host-lifecycle-first-phase-runtime.json; fi
          if [ -f incoming/prelogin-registry-stack-runtime.json ]; then python analysis-tools/prelogin-registry-stack/validate_registry.py incoming/prelogin-registry-stack-runtime.json reports/prelogin-registry-stack-runtime.json; fi
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'analysis-tools/prelogin-registry-stack')
          from ci_status import status
          r=json.loads(Path('incoming/prelogin-registry-stack-ci.json').read_text())
          expected=status(os.environ['SOURCE'],os.environ['RUN'],'completed',r['dependencies'],r['tests'],r['observation'],r['sanitization'])
          if r!=expected:raise SystemExit('typed_outcome_mismatch')
          Path('reports/prelogin-registry-stack-ci.json').write_text(json.dumps(r,indent=2)+'\n')
          p=Path('incoming/prelogin-registry-stack-runtime.json')
          if p.exists():
           data=json.loads(p.read_text())
           if data['source_commit']!=os.environ['SOURCE'] or data['run_id']!=os.environ['RUN']:raise SystemExit('source_mismatch')
          PY
          git config user.name prelogin-wire-report
          git config user.email prelogin-wire-report@users.noreply.github.com
          git add -- reports/prelogin-registry-stack-ci.json
          if test -f incoming/prelogin-registry-stack-runtime.json; then git add -- reports/prelogin-registry-stack-runtime.json; fi
          for p in reports/prelogin-host-lifecycle-runtime.json reports/prelogin-host-lifecycle-first-phase-runtime.json; do if test -f "$p"; then git add -- "$p"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m 'lab: publish sanitized direct registry stack evidence'
          git push origin HEAD:research/prelogin-telemetry-wow-data-provenance
