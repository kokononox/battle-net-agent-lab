name: Direct prelogin UserUUID accurate main-image stack trace
on:
  push:
    branches: [research/prelogin-telemetry-wow-data-provenance]
    paths:
      - 'analysis-tools/prelogin-registry-stack/**'
      - '.github/workflows/prelogin-registry-stack.yml'
permissions: {}
concurrency:
  group: prelogin-registry-stack-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved registry stack a12'
    runs-on: windows-2025
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned observation dependencies
        run: python -m pip install --disable-pip-version-check frida==17.24.2 protobuf==6.33.0
      - name: Existing safety and native contracts plus private equality tests
        run: |
          python scripts/run_safety_tests.py --output output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s analysis-tools/prelogin-wire-h2 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s analysis-tools/prelogin-wire-h3 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s analysis-tools/prelogin-host-lifecycle -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s analysis-tools/prelogin-registry-stack -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node analysis-tools/prelogin-registry-stack/contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native registry and wire gates then two pinned pre-login startups
        env:
          BNET_REGISTRY_TRACE: approved-registry-stack-a12
        run: python analysis-tools/prelogin-registry-stack/run_registry.py
      - name: Strictly validate fixed-key registry summary
        if: always()
        run: python analysis-tools/prelogin-registry-stack/validate_registry.py output/prelogin-registry-stack-runtime.json sanitized/prelogin-registry-stack-runtime.json
      - name: Strictly validate only the shareable summary
        if: always()
        run: |
          if (Test-Path output/prelogin-host-lifecycle.json) {
            python analysis-tools/prelogin-host-lifecycle/validate_lifecycle.py output/prelogin-host-lifecycle.json sanitized/prelogin-host-lifecycle.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Strictly validate first-phase qualification diagnostics
        if: always()
        run: |
          if (Test-Path output/prelogin-wire-h3-target.json) {
            python analysis-tools/prelogin-wire-h3/target_validate.py output/prelogin-wire-h3-target.json sanitized/prelogin-host-lifecycle-first-phase.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload summary only, never ETL PCAP TLS buffers or binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: prelogin-registry-stack-summary
          path: sanitized/
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: observe
    if: needs.observe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/prelogin-telemetry-wow-data-provenance
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: prelogin-registry-stack-summary
          path: incoming
      - name: Revalidate on clean runner and publish fixed-path JSON only
        run: |
          set -euo pipefail
          if [ -f incoming/prelogin-host-lifecycle.json ]; then python analysis-tools/prelogin-host-lifecycle/validate_lifecycle.py incoming/prelogin-host-lifecycle.json reports/prelogin-host-lifecycle-runtime.json; fi
          if [ -f incoming/prelogin-host-lifecycle-first-phase.json ]; then python analysis-tools/prelogin-wire-h3/target_validate.py incoming/prelogin-host-lifecycle-first-phase.json reports/prelogin-host-lifecycle-first-phase-runtime.json; fi
          python analysis-tools/prelogin-registry-stack/validate_registry.py incoming/prelogin-registry-stack-runtime.json reports/prelogin-registry-stack-runtime.json
          git config user.name prelogin-wire-report
          git config user.email prelogin-wire-report@users.noreply.github.com
          git add -- reports/prelogin-registry-stack-runtime.json
          for p in reports/prelogin-host-lifecycle-runtime.json reports/prelogin-host-lifecycle-first-phase-runtime.json; do if test -f "$p"; then git add -- "$p"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m 'lab: publish sanitized direct registry stack evidence'
          git push origin HEAD:research/prelogin-telemetry-wow-data-provenance
