name: Minimal Battle.net installation C0
on:
  push:
    branches: [research/battlenet-minimal-install-isolation-2026-10-25]
    paths: ['analysis-tools/minimal-install/**', '.github/workflows/minimal-battlenet-install.yml']
permissions: {}
concurrency:
  group: minimal-battlenet-install-c0
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.event.head_commit.message == 'lab: approved minimal Battle.net install C0 20261025-a2' && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      BNET_MINIMAL_INSTALL: 'lab: approved minimal Battle.net install C0 20261025-a2'
      BNET_CASE: C0b-native-install-page-diagnostic
      EXPECTED_SOURCE: '${{ github.sha }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test pure guards before any target execution
        run: python -m unittest discover -s analysis-tools/minimal-install/tests -v
      - name: Bounded temporary official client installation
        run: python analysis-tools/minimal-install/run_case.py
      - name: Validate only sanitized fixed-schema report
        if: always()
        run: python analysis-tools/minimal-install/validate_report.py output/minimal-install-c0b.json sanitized/minimal-install-c0b.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: minimal-install-c0b-sanitized
          path: sanitized/minimal-install-c0b.json
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: observe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      EXPECTED_SOURCE: '${{ github.sha }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/battlenet-minimal-install-isolation-2026-10-25
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: minimal-install-c0b-sanitized
          path: sanitized
      - name: Revalidate exact source and run identity
        run: python analysis-tools/minimal-install/validate_report.py sanitized/minimal-install-c0b.json reports/minimal-install-c0b.json
      - name: Publish report only on this research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- reports/minimal-install-c0b.json
          git diff --cached --quiet && exit 0
          git commit -m 'lab: publish sanitized minimal-install C0 report'
          git push origin HEAD:research/battlenet-minimal-install-isolation-2026-10-25
