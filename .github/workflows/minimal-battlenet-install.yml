name: Minimal Battle.net C1b six-case calibrated hosts pilot
on:
  push:
    branches: [research/battlenet-minimal-install-isolation-2026-10-25]
    paths: ['analysis-tools/minimal-install/**', '.github/workflows/minimal-battlenet-install.yml']
permissions: {}
concurrency:
  group: minimal-battlenet-install-c1b-six-batch
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.event.head_commit.message == 'lab: approved calibrated Battle.net install C1b 20261025-s6b1' && github.run_attempt == 1
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        replica: [r1, r2, r3, r4, r5, r6]
    runs-on: windows-2025
    timeout-minutes: 14
    permissions:
      contents: read
    env:
      BNET_MINIMAL_INSTALL: 'lab: approved calibrated Battle.net install C1b 20261025-s6b1'
      BNET_CASE: C1b-six-calibrated-hosts
      BNET_REPLICA: '${{ matrix.replica }}'
      EXPECTED_SOURCE: '${{ github.sha }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test guards before target execution
        run: python -m unittest discover -s analysis-tools/minimal-install/tests -v
      - name: Bounded independent full-client installation baseline
        run: python analysis-tools/minimal-install/run_case.py
      - name: Validate exact source run and replica
        if: always()
        run: python analysis-tools/minimal-install/validate_report.py output/minimal-install-c1b-${{ matrix.replica }}.json sanitized/minimal-install-c1b-${{ matrix.replica }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: minimal-install-c1b-${{ matrix.replica }}-sanitized
          path: sanitized/minimal-install-c1b-${{ matrix.replica }}.json
          if-no-files-found: error
          retention-days: 3
  publish:
    if: >-
      always() && needs.observe.result != 'skipped' && github.event.head_commit.message == 'lab: approved calibrated Battle.net install C1b 20261025-s6b1' && github.run_attempt == 1
    needs: observe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      EXPECTED_SOURCE: '${{ github.sha }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '${{ github.sha }}'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          pattern: minimal-install-c1b-r*-sanitized
          path: sanitized
          merge-multiple: true
      - name: Publish available validated replicas and explicit missing-report manifest
        run: python analysis-tools/minimal-install/publish_batch.py
      - name: Retain aggregate even if Git publication fails
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: minimal-install-c1b-batch-sanitized
          path: reports/minimal-install-c1b/*.json
          if-no-files-found: error
          retention-days: 3
      - name: Commit this batch only on the isolated research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- reports/minimal-install-c1b
          git diff --cached --quiet && exit 0
          git commit -m 'lab: publish sanitized six-case calibrated C1b batch'
          bash analysis-tools/minimal-install/publish_reports.sh
