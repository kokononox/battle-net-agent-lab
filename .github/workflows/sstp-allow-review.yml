name: Read-only outbound Allow filter review Windows test
on:
  push:
    branches: [privacy-observation-20261018-a1]
    paths: ['sstp-allow-review/**', '.github/workflows/sstp-allow-review.yml']
permissions: {}
jobs:
  windows:
    if: "${{ github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'test: approved read-only Allow review') }}"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse and test bounded filter summaries
        id: model
        continue-on-error: true
        shell: powershell
        run: |
          foreach($f in Get-ChildItem 'sstp-allow-review' -Filter '*.ps1'){
            $t=$null;$e=$null
            $ast=[Management.Automation.Language.Parser]::ParseFile($f.FullName,[ref]$t,[ref]$e)
            if($e.Count){throw 'audit_parse_error'}
            foreach($c in $ast.FindAll({param($n) $n -is [Management.Automation.Language.CommandAst]},$true)){
              if($c.GetCommandName() -match '^(Set|New|Remove|Enable|Disable|Restart|Reset)-(Net|Dns|Vpn|Service|ItemProperty|ScheduledTask)'){throw 'audit_mutation_command'}
            }
          }
          & "$PSHOME/powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File './sstp-allow-review/Test-Model.ps1' -OutputPath (Join-Path $env:RUNNER_TEMP 'audit-model.json')
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          exit 0
      - name: Run audit and compare firewall hosts and IPv6 setting before after
        id: native
        if: steps.model.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          & "$PSHOME/powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File './sstp-allow-review/Test-Native.ps1' -OutputPath (Join-Path $env:RUNNER_TEMP 'audit-native.json')
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          exit 0
      - name: Validate bounded receipt
        if: always()
        env:
          RUNNER_OS_LABEL: ${{ matrix.os }}
          MODEL_OUTCOME: ${{ steps.model.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: python sstp-allow-review/receipt.py
      - name: Upload bounded receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: allow-review-receipt-${{ matrix.os }}
          path: sstp-allow-review/build-receipt.json
          retention-days: 3
          if-no-files-found: error
