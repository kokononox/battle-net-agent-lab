name: Offline Windows scratch-stage tests (no game or installer)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/updater-offline-ci.yml'
      - 'updater-core/**/*.py'
permissions: {}
concurrency:
  group: updater-portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline_windows:
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run synthetic native Windows staging and parser tests
        working-directory: updater-core
        env:
          UPDATER_SOURCE_COMMIT: ${{ github.sha }}
        run: python run_portable_ci.py --output ../ci-output/updater-portable-windows-to-share.json
      - name: Upload minimal JSON only, no raw logs or payload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: updater-portable-offline-receipt
          path: ci-output/updater-portable-windows-to-share.json
          retention-days: 3
          if-no-files-found: error
  publish_receipt:
    if: always()
    needs: offline_windows
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: updater-portable-offline-receipt
          path: incoming
      - name: Validate and publish bounded receipt, never test logs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPDATER_SOURCE_COMMIT: ${{ github.sha }}
        run: python updater-core/publish_portable_ci.py
