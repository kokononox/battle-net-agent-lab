name: Battle.net D2 calibrated resolver guard (no installer)
on:
  push:
    branches: [research/battlenet-minimal-install-isolation-2026-10-25]
    paths: ['analysis-tools/minimal-install/calibrated_hosts.py', 'analysis-tools/minimal-install/qualify_calibrated_hosts.py', 'analysis-tools/minimal-install/tests/test_calibrated_hosts.py', '.github/workflows/battlenet-dns-d2.yml']
permissions: {}
concurrency:
  group: battlenet-dns-d2
  cancel-in-progress: false
jobs:
  qualify:
    if: >-
      github.event.head_commit.message == 'lab: approved calibrated DNS guard D2 20261025' && github.run_attempt == 1
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [telemetry, level3, us-version]
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BNET_DNS_D2: 'lab: approved calibrated DNS guard D2 20261025'
      BNET_DNS_CASE: '${{ matrix.case }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify guards and negative cases before hosts mutation
        run: python -m unittest discover -s analysis-tools/minimal-install/tests -v
      - name: Qualify calibrated hosts gate with independent control and restoration
        run: python analysis-tools/minimal-install/qualify_calibrated_hosts.py
      - name: Validate strict source run and case identity
        if: always()
        run: python analysis-tools/minimal-install/qualify_calibrated_hosts.py --validate output/dns-d2-${{ matrix.case }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: battlenet-dns-d2-${{ matrix.case }}-sanitized
          path: output/dns-d2-${{ matrix.case }}.json
          if-no-files-found: error
          retention-days: 3
