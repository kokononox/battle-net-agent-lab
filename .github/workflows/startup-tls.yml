name: One-shot live PID TLS API input observation
on:
  push:
    branches: [privacy-observation-20261018-a1]
    paths:
      - 'privacy-tls/**'
      - '.github/workflows/startup-tls.yml'
permissions: {}
jobs:
  observe:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'lab: approved signed-client live TLS input observation 20261018-d2'
    runs-on: windows-2025
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact hashed lab tools, never on user PC
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r privacy-tls/requirements.txt
      - name: Test safety and field-name-only output
        run: |
          python scripts/run_safety_tests.py --output output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s privacy-network -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s privacy-tls -p 'test_*.py'
      - name: Owned loopback self-test, then verified live client observation
        env:
          PRIVACY_TLS_ONCE: tls-20261018-d2
        run: python privacy-tls/run.py
      - name: Whitelist metadata only
        if: always()
        run: |
          python privacy-tls/validate.py output/live-tls-metadata.json sanitized/live-tls-metadata.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path output/network-metadata.json) {
            python privacy-network/validate.py output/network-metadata.json sanitized/network-metadata.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (Test-Path output/agent-observation-to-share.json) {
            python scripts/validate_report.py --input output/agent-observation-to-share.json --output sanitized/agent-observation-to-share.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload only explicit sanitized JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: startup-tls-sanitized
          path: |
            sanitized/live-tls-metadata.json
            sanitized/network-metadata.json
            sanitized/agent-observation-to-share.json
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: observe
    if: needs.observe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: privacy-observation-20261018-a1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: startup-tls-sanitized
          path: incoming
      - name: Revalidate and publish from clean runner
        run: |
          set -euo pipefail
          python privacy-tls/validate.py incoming/live-tls-metadata.json reports/startup-tls-d2-live.json
          git add -- reports/startup-tls-d2-live.json
          if test -f incoming/network-metadata.json; then
            python privacy-network/validate.py incoming/network-metadata.json reports/startup-tls-d2-network.json
            git add -- reports/startup-tls-d2-network.json
          fi
          if test -f incoming/agent-observation-to-share.json; then
            python scripts/validate_report.py --input incoming/agent-observation-to-share.json --output reports/startup-tls-d2-bootstrap.json
            git add -- reports/startup-tls-d2-bootstrap.json
          fi
          git config user.name 'privacy-lab-report'
          git config user.email 'privacy-lab-report@users.noreply.github.com'
          git commit -m 'lab: publish sanitized live TLS API input evidence 20261018-d2'
          git push origin HEAD:privacy-observation-20261018-a1
