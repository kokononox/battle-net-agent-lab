name: One-shot integrated native quarantine and full-policy recovery
on:
  push:
    branches: [privacy-observation-20261018-a1]
    paths: ['sstp-integrated-transaction/**', '.github/workflows/sstp-integrated-transaction.yml']
permissions: {}
jobs:
  integrated_tests:
    if: "${{ github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'lab: approved integrated native full-policy recovery p9') }}"
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse and test integrated native journal recovery
        id: native
        continue-on-error: true
        shell: powershell
        run: |
          foreach($f in Get-ChildItem 'sstp-integrated-transaction' -Filter '*.ps1') {
            $tokens=$null;$errors=$null
            $ast=[Management.Automation.Language.Parser]::ParseFile($f.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0) { throw 'integrated_parse_error' }
            $text=[IO.File]::ReadAllText($f.FullName)
            if($text -match '(?i)Set-NetFirewallProfile|Set-VpnConnection|Resolve-DnsName|GetHostAddresses|Invoke-WebRequest|Invoke-Expression|Register-ScheduledTask|Start-Process|advfirewall|rasdial|HttpClient') { throw 'integrated_forbidden_operation' }
          }
          & './sstp-integrated-transaction/Test-Engine.ps1' -OutputPath (Join-Path $env:RUNNER_TEMP 'integrated.json')
          if($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate bounded receipt only
        if: always()
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: python sstp-integrated-transaction/receipt.py
      - name: Upload receipt only, never private journals or inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sstp-integrated-transaction-receipt
          path: sstp-integrated-transaction/build-receipt.json
          retention-days: 3
          if-no-files-found: error
