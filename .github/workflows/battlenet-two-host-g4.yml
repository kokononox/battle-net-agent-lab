name: Battle.net two-host listener G4 read-only diagnosis
on:
  push:
    branches: [research/battlenet-minimal-install-isolation-2026-10-25]
    paths: ['analysis-tools/two-host-install/diagnose_listener.ps1', '.github/workflows/battlenet-two-host-g4.yml']
permissions: {}
jobs:
  diagnose:
    if: >-
      github.event.head_commit.message == 'lab: approved two-host listener diagnosis G4 20261025' && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      BNET_TWO_HOSTS: 'lab: approved two-host listener diagnosis G4 20261025'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect listener ownership and excluded ports without changing services
        shell: powershell
        run: '& ./analysis-tools/two-host-install/diagnose_listener.ps1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: battlenet-two-host-listener-g4-sanitized
          path: output/two-hosts-listener-g4.json
          if-no-files-found: error
          retention-days: 3
